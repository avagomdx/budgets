# XcodeGen configuration. The Xcode project is generated from this file
# (locally: `brew install xcodegen && xcodegen generate`; automatically in GitHub Actions).
name: Budget

options:
  bundleIdPrefix: com.anthony
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Budget:
    type: application
    platform: iOS
    sources:
      - path: Budget
    scheme: {}
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Unlock Budget with Face ID.
        NSCameraUsageDescription: Take a photo of a receipt to keep with an expense.
        CFBundleURLTypes:
          - CFBundleURLName: com.anthony.budget.callback
            CFBundleURLSchemes:
              - budgetapp
    settings:
      base:
        PRODUCT_NAME: Budget
        PRODUCT_BUNDLE_IDENTIFIER: com.anthony.budget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Budget
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
