# XcodeGen-configuratie. Het Xcode-project wordt hieruit gegenereerd
# (lokaal: `brew install xcodegen && xcodegen generate`, in GitHub Actions automatisch).
name: Budget

options:
  bundleIdPrefix: com.anthony
  developmentLanguage: nl
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Budget:
    type: application
    platform: iOS
    sources:
      - path: Budget
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Budget
        PRODUCT_BUNDLE_IDENTIFIER: com.anthony.budget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Budget
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
