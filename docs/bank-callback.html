<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Budget – back to the app</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 48px 24px; text-align: center;
         color: #1c1c1e; background: #f2f2f7; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p { color: #6c6c70; line-height: 1.4; }
  a.button { display: inline-block; margin-top: 24px; padding: 14px 28px; border-radius: 12px;
             background: #239E6B; color: #fff; text-decoration: none; font-weight: 600; font-size: 17px; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } p { color: #a1a1a6; } }
</style>
</head>
<body>
  <h1 id="title">Almost done</h1>
  <p id="text">Returning to the Budget app…</p>
  <a class="button" id="open" href="#">Open Budget</a>
  <script>
    // Forward the bank's response (code, state or error) to the app.
    var target = "budgetapp://bank-callback" + window.location.search;
    document.getElementById("open").href = target;
    window.location.href = target;
  </script>
</body>
