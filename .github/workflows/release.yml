name: Build & release

# Run manually: Actions tab → "Build & release" → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.0), must be higher than the previous one"
        required: true
        default: "1.0.0"
      notes:
        description: "What's new?"
        required: false
        default: "New version"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      BUILD_NUMBER: ${{ github.run_number }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate version number
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Invalid version number '$VERSION'. Use e.g. 1.0.0"
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Version v$VERSION already exists. Choose a higher number."
            exit 1
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned; AltStore signs it on install)
        run: |
          set -o pipefail
          xcodebuild \
            -project Budget.xcodeproj \
            -scheme Budget \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "(error|warning):|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Budget.app || {
            echo "::error::Build failed, see the log above"; tail -n 80 build.log; exit 1; }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Budget.app Payload/
          zip -qry Budget.ipa Payload
          ls -lh Budget.ipa

      - name: Create GitHub release
        run: |
          gh release create "v$VERSION" Budget.ipa \
            --title "Budget $VERSION" \
            --notes "$NOTES"

      - name: Update AltStore source (apps.json)
        run: |
          python3 scripts/update_source.py \
            --repo "$REPO" --branch "$BRANCH" --owner "$OWNER" \
            --version "$VERSION" --build "$BUILD_NUMBER" \
            --ipa Budget.ipa --notes "$NOTES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "AltStore source: version $VERSION"
          git push

      - name: Summary
        run: |
          {
            echo "### Budget $VERSION released"
            echo ""
            echo "AltStore source URL:"
            echo ""
            echo "\`https://raw.githubusercontent.com/$REPO/$BRANCH/apps.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
